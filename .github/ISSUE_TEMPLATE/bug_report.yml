name: Bug report
description: Something does not work as expected
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove secrets, tokens and private hostnames from logs before pasting.
  - type: input
    id: dsh-version
    attributes:
      label: DeepSeek Harness version
      placeholder: e.g. 0.2.2-rc.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: e.g. Windows 11 24H2 / macOS 15.1 / Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.11.0
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Plugin config
      description: Paste the plugin config with hostnames / paths redacted.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Contents of the sync log (usually `$DSH_HOME/memory-sync/sync.log`) and `last-run.json`.
      render: text
